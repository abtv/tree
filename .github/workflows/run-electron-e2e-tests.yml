name: Run Electron E2E tests

on:
  workflow_call:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: electron-e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Audit Electron E2E dependencies
    uses: ./.github/workflows/audit-dependencies.yml
    with:
      caller: e2e
  macos:
    needs: audit
    if: ${{ !cancelled() && (needs.audit.result == 'success' || needs.audit.result == 'skipped') }}
    name: Run macOS Electron E2E tests (shard ${{ matrix.shard }}/4)
    runs-on: macos-15
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      # Each shard runs on its own machine, so the machine-global clipboard lock and the stubbed
      # global shortcut never contend across shards.
      - name: Run Electron end-to-end tests
        run: npx playwright test -c config/testing/playwright.macos.config.ts --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-macos-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  linux:
    needs: audit
    if: ${{ !cancelled() && (needs.audit.result == 'success' || needs.audit.result == 'skipped') }}
    name: Run Linux Electron E2E tests
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Electron is installed by npm; only its display/system dependencies are needed.
      - name: Install Linux display dependencies
        run: npx playwright install-deps chromium

      - name: Build application
        run: npm run build

      - name: Run Electron end-to-end tests
        run: xvfb-run --auto-servernum npx playwright test -c config/testing/playwright.linux.config.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-linux-1-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # A single stable check name for every shard, so a required status check keeps working.
  e2e:
    name: Require all Electron E2E shards to pass
    if: always()
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Require every shard to pass
        env:
          MACOS_RESULT: ${{ needs.macos.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
        run: |
          test "$MACOS_RESULT" = "success"
          test "$LINUX_RESULT" = "success"
