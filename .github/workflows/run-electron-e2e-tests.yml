name: Run Electron E2E tests

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit Electron E2E dependencies
    uses: ./.github/workflows/audit-dependencies.yml
    with:
      caller: e2e
  shard:
    needs: audit
    name: Run Electron E2E tests (shard ${{ matrix.shard }}/6)
    runs-on: macos-15
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      # Each shard runs on its own machine, so the machine-global clipboard lock and the stubbed
      # global shortcut never contend across shards.
      - name: Run Electron end-to-end tests
        run: npx playwright test --shard=${{ matrix.shard }}/6

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # A single stable check name for every shard, so a required status check keeps working.
  e2e:
    name: Require all Electron E2E shards to pass
    if: always()
    needs: shard
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Require every shard to pass
        run: test "${{ needs.shard.result }}" = "success"
