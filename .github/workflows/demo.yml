name: Generate demo

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/record-demo.mjs'
      - 'scripts/readme-screenshots.mjs'
      - 'docs/images/demo-document.json'
      - 'e2e/electron-entry.cjs'
      - 'e2e/hidden-windows.cjs'
      - 'e2e/shortcut-stub.cjs'
      - 'package.json'
      - 'package-lock.json'
      - 'electron.vite.config.ts'
      - '.nvmrc'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Record demo video
        run: npm run demo:video
      - name: Capture README screenshots
        run: node scripts/readme-screenshots.mjs
      # Pages replaces the whole site on each deployment, so the video and screenshots publish together.
      - name: Assemble Pages content
        run: |
          mkdir -p reports/site
          cp -R reports/demo/. reports/site/
          cp reports/readme/tree-overview.png reports/readme/tree-focus-dark.png reports/site/
      - name: Upload demo
        uses: actions/upload-artifact@v7
        with:
          name: tree-demo
          path: reports/site/
          if-no-files-found: error
          retention-days: 1
      - name: Upload capture diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tree-demo-diagnostics
          path: |
            reports/demo/
            reports/readme/
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload Pages content
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: reports/site/

  publish:
    if: github.ref == 'refs/heads/main'
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Publish demo video and README screenshots
        id: deployment
        uses: actions/deploy-pages@v5
