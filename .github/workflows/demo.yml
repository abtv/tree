name: Generate demo

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: demo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Record demo video
        run: npm run demo:video
      - name: Capture README screenshots
        run: node scripts/readme-screenshots.mjs
      # Pages replaces the whole site on each deployment, so the video and screenshots publish together.
      - name: Assemble Pages content
        run: |
          mkdir -p reports/site
          cp -R reports/demo/. reports/site/
          cp reports/readme/tree-overview.png reports/readme/tree-focus-dark.png reports/readme/agenda-light.png reports/site/
      - name: Upload demo
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tree-demo
          path: reports/site/
          if-no-files-found: error
          retention-days: 1
      - name: Upload capture diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tree-demo-diagnostics
          path: |
            reports/demo/
            reports/readme/
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload Pages content
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: reports/site/

  publish:
    if: github.ref == 'refs/heads/main'
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Publish demo video and README screenshots
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
