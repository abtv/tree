name: Test and build app

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit dependencies
    uses: ./.github/workflows/audit-dependencies.yml
    with:
      caller: ci
  check:
    name: Check code and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check new commit release notes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check-release-notes.mts

      - name: Install dependencies
        run: npm ci

      - name: Check types, lint and formatting
        run: npm run typecheck && npm run lint && npm run format:check
      - name: Check documentation links
        run: npm run check:docs -- --group links
      - name: Check test references in documentation
        run: npm run check:docs -- --group tests
      - name: Check architecture decision records
        run: npm run check:docs -- --group decisions
      - name: Check documentation structure
        run: npm run check:docs -- --group structure
      - name: Check requirement test coverage
        run: npm run check:requirements
      - name: Check editing-mode coverage and agent permissions
        run: npm run check:e2e-modes && npm run check:opencode
      - name: Run unit tests
        run: npm run test:coverage

  chrome:
    name: Run browser E2E tests
    needs: [check, audit, version, smoke]
    if: needs.version.outputs.ready == 'true'
    uses: ./.github/workflows/run-web-e2e-tests.yml

  smoke:
    name: Run smoke tests
    needs: [check, audit]
    uses: ./.github/workflows/run-smoke-tests.yml

  electron:
    name: Run release Electron E2E tests
    needs: [check, audit, version, smoke]
    if: needs.version.outputs.ready == 'true'
    uses: ./.github/workflows/run-electron-e2e-tests.yml

  memory:
    name: Run release Electron memory tests
    needs: [check, audit, version, smoke]
    if: needs.version.outputs.ready == 'true'
    uses: ./.github/workflows/run-electron-memory-tests.yml

  version:
    name: Detect release version
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      ready: ${{ steps.version.outputs.ready }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Check release version
        id: version
        if: github.event_name == 'push' && github.repository == 'abtv/tree'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publication.mts version

  candidate:
    name: Check release version
    needs: [check, audit, version, chrome, smoke, electron, memory]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      ready: ${{ needs.version.outputs.ready }}
      version: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Require applicable validation jobs to succeed
        env:
          RELEASE_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/web-release/cli.mts gate
      - name: Download the successful browser job's immutable package
        if: needs.version.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.chrome.outputs.artifact_id }}
          path: checked-browser
      - name: Install locked package verifier without lifecycle scripts
        if: needs.version.outputs.ready == 'true'
        run: npm ci --ignore-scripts
      - name: Verify package and bind it to the successful validation attempt
        if: needs.version.outputs.ready == 'true'
        env:
          TESTED_BROWSER_ATTEMPT: ${{ needs.chrome.outputs.attempt }}
        run: node scripts/web-release/cli.mts seal checked-browser/web checked-browser/web-provenance.json
      - name: Preserve release package for this validation attempt
        if: needs.version.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            checked-browser/web/
            checked-browser/web-provenance.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  dispatch:
    name: Start approved publications
    needs: candidate
    if: github.event_name == 'push' && github.repository == 'abtv/tree'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Start demo and eligible release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_READY: ${{ needs.candidate.outputs.ready }}
          RELEASE_VERSION: ${{ needs.candidate.outputs.version }}
        run: node scripts/publication.mts dispatch
