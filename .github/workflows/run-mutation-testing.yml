name: Run mutation testing

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation
  cancel-in-progress: true

jobs:
  audit:
    name: Audit mutation testing dependencies
    uses: ./.github/workflows/audit-dependencies.yml
    with:
      caller: mutation
  mutation:
    needs: audit
    name: Run mutation testing (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    # The Stryker configuration owns both the full scope and each layer's shard.
    strategy:
      fail-fast: false
      matrix:
        shard: [renderer, web, shared, electron, infrastructure]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The runner has 4 vCPUs; Stryker defaults to fewer test runner processes.
      - name: Run mutation testing (${{ matrix.shard }})
        env:
          TREE_MUTATION_SHARD: ${{ matrix.shard }}
        run: npm run test:mutation -- --force --concurrency 4

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutation-report-${{ matrix.shard }}
          path: reports/mutation/
          if-no-files-found: ignore
