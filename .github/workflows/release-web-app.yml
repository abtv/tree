name: Release web app

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

# Preserve in-flight publication; reject stale candidates before transfer/deploy.
concurrency:
  group: browser-release-main
  cancel-in-progress: false

jobs:
  check:
    needs: audit
    name: Validate code
    uses: ./.github/workflows/check-code-test-and-build.yml
  audit:
    name: Require release dependency audit
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/require-dependency-audit.yml
  chrome:
    needs: audit
    name: Run web E2E tests
    uses: ./.github/workflows/run-web-e2e-tests.yml
  gate:
    name: Approve web release
    if: always()
    needs: [check, audit, chrome]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Require all applicable checks of this commit
        env:
          RELEASE_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/web-release/cli.mts gate

  sign:
    name: Sign web package manifest
    needs: [gate]
    if: ${{ !cancelled() && needs.gate.result == 'success' && github.repository == 'abtv/tree' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: browser-${{ github.sha }}-${{ github.run_attempt }}
          path: signed-browser
      - name: Authenticate previous assets and prepare complete manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/web-release/cli.mts prepare signed-browser/web signed-browser/web-provenance.json
      - name: Attest the exact manifest committing to all package bytes
        id: attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: signed-browser/web-provenance.json
          create-storage-record: false
      - name: Preserve detached proof
        env:
          BUNDLE_PATH: ${{ steps.attestation.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" signed-browser/web-provenance.sigstore.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-browser-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            signed-browser/web/
            signed-browser/web-provenance.json
            signed-browser/web-provenance.sigstore.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Transfer web package to hosting repository
    needs: [sign]
    if: ${{ !cancelled() && needs.sign.result == 'success' && github.repository == 'abtv/tree' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: web-publication
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Download the tested package from this attempt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: signed-browser-${{ github.sha }}-${{ github.run_attempt }}
          path: verified-browser
      - name: Check package and source gate before obtaining write access
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/web-release/publish.mts preflight verified-browser/web verified-browser/web-provenance.json
      - name: Create target-only installation token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ vars.WEB_PUBLISH_APP_ID }}
          private-key: ${{ secrets.WEB_PUBLISH_APP_PRIVATE_KEY }}
          owner: tree-editor
          repositories: tree-editor.github.io
          permission-contents: write
      - name: Append package to hosting repository
        env:
          GH_TOKEN: ${{ github.token }}
          WEB_TARGET_TOKEN: ${{ steps.app.outputs.token }}
        run: node scripts/web-release/publish.mts transfer verified-browser/web verified-browser/web-provenance.json
