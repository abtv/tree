name: Audit dependencies

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      caller:
        type: string
        default: audit

permissions:
  contents: read

concurrency:
  group: audit-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.caller || 'audit' }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit npm dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      - name: Audit dependencies at high severity or above
        run: npm audit --audit-level=high
      - name: Identify the automatic event and checkout SHA
        id: identity
        if: ${{ always() && (github.event_name == 'push' || github.event_name == 'pull_request') }}
        run: node scripts/dependency-audit.mts identify
      - name: Record audit event identity for independent workflows
        if: ${{ always() && steps.identity.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.identity.outputs.marker }}-${{ github.run_attempt }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
