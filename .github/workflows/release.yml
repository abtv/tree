name: Release macOS

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check tag and reserve draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const p=require("./package.json"); if(process.env.RELEASE_TAG !== `v${p.version}`) throw Error("Tag must match package version")'
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes "Artifacts are pending validation. Do not publish until this workflow succeeds."
      - run: npm ci
      - run: npm run check
      - run: npm run test:smoke:electron
      - name: Build signed and notarized DMG
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          : "${CSC_LINK:?Missing CSC_LINK}" "${CSC_KEY_PASSWORD:?Missing CSC_KEY_PASSWORD}"
          : "${APPLE_API_KEY_BASE64:?Missing APPLE_API_KEY}" "${APPLE_API_KEY_ID:?Missing APPLE_API_KEY_ID}" "${APPLE_API_ISSUER:?Missing APPLE_API_ISSUER}"
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$APPLE_API_KEY"' EXIT
          umask 077
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$APPLE_API_KEY"
          npx --no-install electron-builder --mac dmg --arm64 --publish never
          codesign --verify --deep --strict --verbose=2 dist/mac-arm64/Tree.app
          codesign -dv dist/mac-arm64/Tree.app 2>&1 | grep 'Authority=Developer ID Application:'
          xcrun stapler validate dist/mac-arm64/Tree.app
          spctl --assess --type execute --verbose=2 dist/mac-arm64/Tree.app
          codesign --verify --strict --verbose=2 dist/Tree-*.dmg
          codesign -dv dist/Tree-*.dmg 2>&1 | grep 'Authority=Developer ID Application:'
          xcrun notarytool submit dist/Tree-*.dmg --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple dist/Tree-*.dmg
          xcrun stapler validate dist/Tree-*.dmg
          spctl --assess --type open --context context:primary-signature --verbose=2 dist/Tree-*.dmg
      - name: Upload verified artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" dist/Tree-*.dmg
          gh release edit "$RELEASE_TAG" --notes "Signed and notarized macOS arm64 build. Test the DMG before publishing this draft."
