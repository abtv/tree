name: Create macOS release draft

on:
  workflow_call:
    inputs:
      run_id:
        type: string
        required: true
      run_attempt:
        type: string
        required: true
      sha:
        type: string
        required: true
      version:
        type: string
        required: true

env:
  VALIDATION_RUN_ID: ${{ inputs.run_id }}
  VALIDATION_RUN_ATTEMPT: ${{ inputs.run_attempt }}
  VALIDATION_SHA: ${{ inputs.sha }}
  RELEASE_VERSION: ${{ inputs.version }}

permissions:
  contents: read
  actions: read

concurrency:
  group: release-macos-main
  cancel-in-progress: false

jobs:
  candidate:
    name: Check macOS release candidate
    if: ${{ github.repository == 'abtv/tree' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      ready: ${{ steps.plan.outputs.ready }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Verify successful source and version without writes
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-draft.mts plan
  release:
    name: Build and test macOS installer
    needs: candidate
    if: needs.candidate.outputs.ready == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Recheck source and reserve immutable tag and draft
        id: reserve
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-draft.mts reserve
      - run: npm ci
        if: steps.reserve.outputs.ready == 'true'
      - name: Build checked source
        if: steps.reserve.outputs.ready == 'true'
        run: npm run build
      - name: Build signed and notarized DMG
        if: steps.reserve.outputs.ready == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          : "${CSC_LINK:?Missing CSC_LINK}" "${CSC_KEY_PASSWORD:?Missing CSC_KEY_PASSWORD}"
          : "${APPLE_API_KEY_BASE64:?Missing APPLE_API_KEY}" "${APPLE_API_KEY_ID:?Missing APPLE_API_KEY_ID}" "${APPLE_API_ISSUER:?Missing APPLE_API_ISSUER}"
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$APPLE_API_KEY"' EXIT
          umask 077
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$APPLE_API_KEY"
          npx --no-install electron-builder --mac dmg --arm64 --publish never
          node scripts/verify-release-fuses.mts dist/mac-arm64/Tree.app
          node scripts/packaged-smoke.mts dist/mac-arm64/Tree.app
          codesign --verify --deep --strict --verbose=2 dist/mac-arm64/Tree.app
          codesign -dvv dist/mac-arm64/Tree.app 2>&1 | grep 'Authority=Developer ID Application:'
          xcrun stapler validate dist/mac-arm64/Tree.app
          spctl --assess --type execute --verbose=2 dist/mac-arm64/Tree.app
          codesign --verify --strict --verbose=2 dist/Tree-*.dmg
          codesign -dvv dist/Tree-*.dmg 2>&1 | grep 'Authority=Developer ID Application:'
          xcrun notarytool submit dist/Tree-*.dmg --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple dist/Tree-*.dmg
          xcrun stapler validate dist/Tree-*.dmg
          spctl --assess --type open --context context:primary-signature --verbose=2 dist/Tree-*.dmg
      - name: Upload verified artifact
        if: steps.reserve.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.reserve.outputs.release_id }}
        run: node scripts/release-draft.mts upload
