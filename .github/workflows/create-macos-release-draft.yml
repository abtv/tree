name: Create macOS release draft

on:
  workflow_call:
    secrets:
      CSC_LINK:
        required: true
      CSC_KEY_PASSWORD:
        required: true
      APPLE_API_KEY:
        required: true
      APPLE_API_KEY_ID:
        required: true
      APPLE_API_ISSUER:
        required: true
    inputs:
      run_id:
        type: string
        required: true
      run_attempt:
        type: string
        required: true
      sha:
        type: string
        required: true
      version:
        type: string
        required: true

env:
  VALIDATION_RUN_ID: ${{ inputs.run_id }}
  VALIDATION_RUN_ATTEMPT: ${{ inputs.run_attempt }}
  VALIDATION_SHA: ${{ inputs.sha }}
  RELEASE_VERSION: ${{ inputs.version }}

permissions:
  contents: read
  actions: read

concurrency:
  group: release-macos-main
  cancel-in-progress: false

jobs:
  candidate:
    name: Check macOS release candidate
    if: ${{ github.repository == 'abtv/tree' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      ready: ${{ steps.plan.outputs.ready }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify successful source and version without writes
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-draft.mts plan
  reserve:
    name: Reserve macOS release draft
    needs: candidate
    if: needs.candidate.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
      actions: read
    outputs:
      ready: ${{ steps.reserve.outputs.ready }}
      release_id: ${{ steps.reserve.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Recheck source and reserve immutable tag and draft
        id: reserve
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-draft.mts reserve
      - name: Publication reminder
        run: echo 'Review the release notes and test the signed DMG after the macOS release job succeeds before publishing.' >> "$GITHUB_STEP_SUMMARY"
  sign:
    name: Sign macOS installer
    needs: [candidate, reserve]
    if: needs.reserve.outputs.ready == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      sha256: ${{ steps.digest.outputs.sha256 }}
      zip_sha256: ${{ steps.digest.outputs.zip_sha256 }}
      metadata_sha256: ${{ steps.digest.outputs.metadata_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - name: Build checked source
        run: npm run build
      - name: Build signed and notarized DMG
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          : "${CSC_LINK:?Missing CSC_LINK}" "${CSC_KEY_PASSWORD:?Missing CSC_KEY_PASSWORD}"
          : "${APPLE_API_KEY_BASE64:?Missing APPLE_API_KEY}" "${APPLE_API_KEY_ID:?Missing APPLE_API_KEY_ID}" "${APPLE_API_ISSUER:?Missing APPLE_API_ISSUER}"
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$APPLE_API_KEY"' EXIT
          umask 077
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$APPLE_API_KEY"
          npx --no-install electron-builder --mac dmg zip --arm64 --publish never
          node scripts/verify-release-fuses.mts dist/mac-arm64/Tree.app
          codesign --verify --deep --strict --verbose=2 dist/mac-arm64/Tree.app
          codesign -dvv dist/mac-arm64/Tree.app 2>&1 | grep 'Authority=Developer ID Application:'
          node scripts/stapler-validate.mts dist/mac-arm64/Tree.app
          spctl --assess --type execute --verbose=2 dist/mac-arm64/Tree.app
          codesign --verify --strict --verbose=2 dist/Tree-*.dmg
          codesign -dvv dist/Tree-*.dmg 2>&1 | grep 'Authority=Developer ID Application:'
          xcrun notarytool submit dist/Tree-*.dmg --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          node scripts/stapler-validate.mts --staple dist/Tree-*.dmg
          node scripts/stapler-validate.mts dist/Tree-*.dmg
          spctl --assess --type open --context context:primary-signature --verbose=2 dist/Tree-*.dmg
      - name: Record signed installer identity
        id: digest
        run: node scripts/release-artifact.mts record
      - name: Preserve signed installer without executing it
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/Tree-*.dmg
            dist/Tree-*.zip
            dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 7
  verify:
    name: Test signed installer on isolated macOS runner
    needs: [candidate, sign]
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact_id }}
          path: dist
          merge-multiple: true
      - name: Require original signed bytes
        id: digest
        env:
          EXPECTED_DMG_SHA256: ${{ needs.sign.outputs.sha256 }}
          EXPECTED_ZIP_SHA256: ${{ needs.sign.outputs.zip_sha256 }}
          EXPECTED_METADATA_SHA256: ${{ needs.sign.outputs.metadata_sha256 }}
        run: node scripts/release-artifact.mts verify
      - name: Install test dependencies without lifecycle scripts or shared caches
        run: npm ci --ignore-scripts
      - name: Inspect and run the application extracted from the DMG
        env:
          DMG_FILE: ${{ steps.digest.outputs.file }}
        run: |
          set -euo pipefail
          codesign --verify --strict --verbose=2 "$DMG_FILE"
          node scripts/stapler-validate.mts "$DMG_FILE"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG_FILE"
          mount_dir="$RUNNER_TEMP/tree-dmg-mount"
          app_dir="$RUNNER_TEMP/tree-dmg-installed"
          mkdir "$mount_dir" "$app_dir"
          trap 'hdiutil detach "$mount_dir"' EXIT
          hdiutil attach "$DMG_FILE" -readonly -nobrowse -mountpoint "$mount_dir"
          ditto "$mount_dir/Tree.app" "$app_dir/Tree.app"
          codesign --verify --deep --strict --verbose=2 "$app_dir/Tree.app"
          node scripts/stapler-validate.mts "$app_dir/Tree.app"
          spctl --assess --type execute --verbose=2 "$app_dir/Tree.app"
          node scripts/verify-release-fuses.mts "$app_dir/Tree.app"
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" node scripts/packaged-smoke.mts "$app_dir/Tree.app"
          zip_dir="$RUNNER_TEMP/tree-zip-installed"
          mkdir "$zip_dir"
          ditto -x -k "dist/Tree-${RELEASE_VERSION}-arm64.zip" "$zip_dir"
          codesign --verify --deep --strict --verbose=2 "$zip_dir/Tree.app"
          node scripts/stapler-validate.mts "$zip_dir/Tree.app"
          spctl --assess --type execute --verbose=2 "$zip_dir/Tree.app"
          node scripts/verify-release-fuses.mts "$zip_dir/Tree.app"
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" node scripts/packaged-smoke.mts "$zip_dir/Tree.app"
  upload:
    name: Upload tested macOS installer
    needs: [candidate, reserve, sign, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact_id }}
          path: dist
          merge-multiple: true
      - name: Require original signed bytes independently of the test runner
        env:
          EXPECTED_DMG_SHA256: ${{ needs.sign.outputs.sha256 }}
          EXPECTED_ZIP_SHA256: ${{ needs.sign.outputs.zip_sha256 }}
          EXPECTED_METADATA_SHA256: ${{ needs.sign.outputs.metadata_sha256 }}
        run: node scripts/release-artifact.mts verify
      - name: Upload verified artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.reserve.outputs.release_id }}
        run: node scripts/release-draft.mts upload
