name: Run smoke tests

on:
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Run ${{ matrix.platform }} smoke tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: Linux
          - os: macos-15
            platform: macOS
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Enable Safari automation on the disposable runner
        if: runner.os == 'macOS'
        run: sudo safaridriver --enable
      - name: Build Electron application
        run: npm run build
      - name: Build browser application
        id: web-build
        run: npm run build:web
      - name: Check Linux Electron happy path
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:smoke:electron
      - name: Check macOS Electron happy path
        if: runner.os == 'macOS'
        run: npm run test:smoke:electron
      - name: Check Linux Chromium happy path
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.web-build.outcome == 'success' }}
        run: npm run test:smoke:chromium
      - name: Check macOS Safari happy path
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.web-build.outcome == 'success' }}
        run: npm run test:smoke:safari
      - name: Check macOS scroll rendering
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: npm run test:e2e -- e2e/electron/tree-scroll-rendering.spec.ts e2e/electron/agenda-scroll-rendering.spec.ts e2e/electron/scroll-frames.spec.ts --workers=1 --retries=0
      - name: Upload failed scroll rendering evidence
        if: ${{ failure() && runner.os == 'macOS' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scroll-rendering-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
