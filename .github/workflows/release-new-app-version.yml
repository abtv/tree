name: Release new app version
run-name: Release new app version · ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful validation run
        required: true
      run_attempt:
        description: Validation attempt
        required: true
      sha:
        description: Validated source SHA
        required: true
      version:
        description: Validated app version
        required: true

env:
  VALIDATION_RUN_ID: ${{ inputs.run_id }}
  VALIDATION_RUN_ATTEMPT: ${{ inputs.run_attempt }}
  VALIDATION_SHA: ${{ inputs.sha }}
  RELEASE_VERSION: ${{ inputs.version }}

permissions:
  contents: read
  actions: read

# Preserve in-flight publication; reject stale candidates before transfer/deploy.
concurrency:
  group: app-release-main
  cancel-in-progress: false

jobs:
  gate:
    name: Verify checked release source
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Require all applicable checks of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publication.mts verify

  candidate:
    name: Check web release version
    needs: [gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      ready: ${{ steps.version.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Compare package version with the last transferred web release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/web-release/status.mts candidate

  sign:
    name: Sign web package manifest
    needs: [gate, candidate]
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.candidate.outputs.ready == 'true' && github.repository == 'abtv/tree' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: browser-${{ github.sha }}-${{ inputs.run_attempt }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: signed-browser
      - name: Install locked verifier dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Authenticate previous assets and prepare complete manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/web-release/cli.mts prepare signed-browser/web signed-browser/web-provenance.json
      - name: Attest the exact manifest committing to all package bytes
        id: attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: signed-browser/web-provenance.json
          create-storage-record: false
      - name: Preserve detached proof
        env:
          BUNDLE_PATH: ${{ steps.attestation.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" signed-browser/web-provenance.sigstore.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-browser-${{ github.sha }}-${{ inputs.run_id }}-${{ inputs.run_attempt }}
          path: |
            signed-browser/web/
            signed-browser/web-provenance.json
            signed-browser/web-provenance.sigstore.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish web app
    needs: [gate, candidate, sign]
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.candidate.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: web-publication
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Download the tested package from this attempt
        if: needs.candidate.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: signed-browser-${{ github.sha }}-${{ inputs.run_id }}-${{ inputs.run_attempt }}
          path: verified-browser
      - name: Install locked verifier dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Check package and source gate before obtaining write access
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/web-release/status.mts candidate
      - name: Authenticate package before obtaining write access
        if: steps.pending.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/web-release/publish.mts preflight verified-browser/web verified-browser/web-provenance.json
      - name: Create target-only installation token
        if: steps.pending.outputs.ready == 'true'
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ vars.WEB_PUBLISH_APP_ID }}
          private-key: ${{ secrets.WEB_PUBLISH_APP_PRIVATE_KEY }}
          owner: tree-editor
          repositories: tree-editor.github.io
          permission-contents: write
      - name: Append package to hosting repository
        if: steps.pending.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WEB_TARGET_TOKEN: ${{ steps.app.outputs.token }}
        run: node scripts/web-release/publish.mts transfer verified-browser/web verified-browser/web-provenance.json
      - name: Verify deployment and published files
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/web-release/status.mts verify

  macos:
    name: Create macOS release draft
    needs: gate
    uses: ./.github/workflows/create-macos-release-draft.yml
    with:
      run_id: ${{ inputs.run_id }}
      run_attempt: ${{ inputs.run_attempt }}
      sha: ${{ inputs.sha }}
      version: ${{ inputs.version }}
    permissions:
      contents: write
      actions: read
    secrets: inherit
