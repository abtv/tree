name: Mutation testing

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation
  cancel-in-progress: true

jobs:
  mutation:
    name: Mutation testing (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    # The Stryker configuration owns both the full scope and each layer's shard.
    strategy:
      fail-fast: false
      matrix:
        shard: [domain, application, renderer]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The runner has 4 vCPUs; Stryker defaults to fewer test runner processes.
      - name: Run mutation testing (${{ matrix.shard }})
        env:
          TREE_MUTATION_SHARD: ${{ matrix.shard }}
        run: npm run test:mutation -- --force --concurrency 4

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ matrix.shard }}
          path: reports/mutation/
          if-no-files-found: ignore
