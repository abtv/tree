name: Electron E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shard:
    name: Electron E2E shard ${{ matrix.shard }}/4
    runs-on: macos-15
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      # Each shard runs on its own machine, so the machine-global clipboard lock and the stubbed
      # global shortcut never contend across shards.
      - name: Run Electron end-to-end tests
        run: npx playwright test --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # A single stable check name for every shard, so a required status check keeps working.
  e2e:
    name: Electron E2E
    if: always()
    needs: shard
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Require every shard to pass
        run: test "${{ needs.shard.result }}" = "success"
