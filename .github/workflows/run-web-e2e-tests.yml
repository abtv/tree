name: Run web E2E tests

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    name: Audit web dependencies
    uses: ./.github/workflows/audit-dependencies.yml
    with:
      caller: browser
  chrome:
    needs: audit
    name: Test production build (Chromium)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Google Chrome has no Linux arm64 build; the suite uses Playwright's Chromium there.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify generated files in isolated Chromium
        run: npm run test:web:built
      - name: Preserve Chromium test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: chrome-test-results-${{ github.run_attempt }}
          path: |
            test-results/web/
            playwright-report/web/
          if-no-files-found: ignore
          retention-days: 7
      - name: Record tested package provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/web-release/cli.mts manifest out/web out/web-provenance.json
      - name: Preserve tested package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            out/web/
            out/web-provenance.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
