name: Run Electron memory tests

on:
  workflow_call:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-memory-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Audit Electron memory dependencies
    uses: ./.github/workflows/audit-dependencies.yml
    with:
      caller: e2e-memory
  memory:
    needs: audit
    if: ${{ !cancelled() && (needs.audit.result == 'success' || needs.audit.result == 'skipped') }}
    name: Run Electron memory tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux display dependencies
        run: npx playwright install-deps chromium

      - name: Build application
        run: npm run build

      - name: Run shared and fresh memory measurements
        run: xvfb-run --auto-servernum npx playwright test -c config/testing/playwright.memory.config.ts --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: reports/e2e-memory.json

      - name: Upload memory evidence and failure traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-memory
          path: |
            reports/e2e-memory.json
            test-results/
          if-no-files-found: warn
