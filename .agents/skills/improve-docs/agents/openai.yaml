  short_description: 'Improve Tree docs in bounded runs; report questions last'
  default_prompt: 'Use $improve-docs to review Tree documentation for up to 30 minutes, fix unambiguous issues, and run relevant checks. Defer local blockers and continue elsewhere; interrupt me only for a serious blocker preventing all remaining work. Save progress and finish with a short Russian report and grouped questions. Wait for my approval before committing.'
