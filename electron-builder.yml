appId: io.github.abtv.tree
productName: Tree
forceCodeSigning: true
beforePack: scripts/release-guard.mts
directories:
  output: dist
files:
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  - package.json
extraResources:
  - from: node_modules/react/LICENSE
    to: licenses/react-LICENSE
  - from: node_modules/react-dom/LICENSE
    to: licenses/react-dom-LICENSE
  - from: node_modules/scheduler/LICENSE
    to: licenses/scheduler-LICENSE
asar: true
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
mac:
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  icon: assets/icons/tree-icon-source.png
  category: public.app-category.productivity
  hardenedRuntime: true
  entitlements: config/build/entitlements.mac.plist
  entitlementsInherit: config/build/entitlements.mac.plist
  notarize: true
artifactName: Tree-${version}-${arch}.${ext}
dmg:
  sign: true
publish:
  provider: github
  owner: abtv
  repo: tree
  releaseType: draft
