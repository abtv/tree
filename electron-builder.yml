appId: io.github.abtv.tree
productName: Tree
forceCodeSigning: true
directories:
  output: dist
files:
  - out/**/*
  - package.json
asar: true
mac:
  target:
    - target: dmg
      arch: arm64
  icon: assets/icons/tree-icon-source.png
  category: public.app-category.productivity
  hardenedRuntime: true
  entitlements: config/build/entitlements.mac.plist
  entitlementsInherit: config/build/entitlements.mac.plist
  notarize: true
artifactName: Tree-${version}-${arch}.${ext}
publish:
  provider: github
  owner: abtv
  repo: tree
  releaseType: draft
