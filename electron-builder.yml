appId: io.github.abtv.tree
productName: Tree
forceCodeSigning: true
beforePack: scripts/release-guard.mts
directories:
  output: dist
files:
  - out/**/*
  - package.json
asar: true
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
mac:
  target:
    - target: dmg
      arch: arm64
  icon: assets/icons/tree-icon-source.png
  category: public.app-category.productivity
  hardenedRuntime: true
  entitlements: config/build/entitlements.mac.plist
  entitlementsInherit: config/build/entitlements.mac.plist
  notarize: true
artifactName: Tree-${version}-${arch}.${ext}
dmg:
  sign: true
publish:
  provider: github
  owner: abtv
  repo: tree
  releaseType: draft
