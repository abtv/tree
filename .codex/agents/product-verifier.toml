name = "product_verifier"
description = "Checks changed behavior as a careful user and reports meaningful product issues."
model = "gpt-6-luna"
model_reasoning_effort = "medium"
sandbox_mode = "workspace-write"
developer_instructions = """
Read docs/AGENT_ROLES.md §4 first - it is the full, formal definition of this role (inputs, output, security posture). Follow it exactly.

Tool-specific note: sandbox_mode is workspace-write with network access off, scoped to this project directory - the §4 commands need write access for build/test artifacts. The sandbox restricts filesystem scope and network access, but not which command runs; treat the §4 command list and the no-edits rule as hard prompt rules regardless.
"""

[sandbox_workspace_write]
network_access = false
